syntax = "proto3";

import 'nanopb.proto';

package app;

enum CallsetVersion {
    option allow_alias = true;
    MAJOR = 0;
    MINOR = 1;
    PATCH = 0;
}


message AppInfo_call { }
message AppInfo_reply {
    uint32 ver_major = 1;
    uint32 ver_minor = 2;
    uint32 ver_patch = 3;
}

message Callset {
    oneof msg {
        AppInfo_call  appinfo_call = 1;
        AppInfo_reply appinfo_reply = 2;
    }
}
