# Bridge the USB CDC-ACM port. Console moves to uart0 (GP0/GP1).
# Selected by APP_SERIAL_SRC=cdc_acm in CMakeLists.txt together with
# boards/serial_cdc_acm.overlay.
CONFIG_APP_SERIAL_SRC_CDC_ACM=y

CONFIG_SERIAL=y
CONFIG_SWFIFO=y
CONFIG_SERIALPIPE=y
CONFIG_SERIALPIPE_TX_DEPTH=16
CONFIG_SERIALPIPE_LOG_LEVEL_INF=y

# CDC-ACM has no baud rate and no flow control toward the host, so a burst
# arrives at USB speed. SerialPipe drops what does not fit its receive fifo,
# and the bridge drops its oldest queued item when the pool is full. Size both
# for bursts of several kilobytes. A host that streams without pause still
# loses data; pace bulk transfers from the host side.
CONFIG_SERIALPIPE_RX_FIFO_DEPTH=8192
CONFIG_APP_BRIDGE_POOL_DEPTH=64
