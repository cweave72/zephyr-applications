# Bridge uart0 (GP0/GP1). Console stays on USB CDC-ACM.
# Selected by APP_SERIAL_SRC=uart0 in CMakeLists.txt together with
# boards/serial_uart0.overlay.
CONFIG_APP_SERIAL_SRC_UART0=y

CONFIG_SERIAL=y
CONFIG_SWFIFO=y
CONFIG_SERIALPIPE=y
CONFIG_SERIALPIPE_TX_DEPTH=16
CONFIG_SERIALPIPE_LOG_LEVEL_INF=y
