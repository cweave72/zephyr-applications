# Network type for this board. This single declaration drives both the Kconfig
# symbol and which conf/ fragment the build applies (see CMakeLists.txt and
# common/scripts/cmake/app_net_type.cmake).
CONFIG_APP_NET_TYPE_ETH=y

# The board puts the console on USB CDC-ACM, so there is an interactive port
# available with no extra hardware. Enable the shell on it -- the app only logs
# during startup, which USB enumeration always misses, so without a prompt the
# port looks dead even when it is working.
CONFIG_SHELL=y
