# callsets.yaml
#
# ID:  The callset id assigned to a callset by an application.
#  name: Name used as the key in the api dict.
#  pkg: Package name where the protobuf bindings are located.
#  mod: Module name of the protobuf bindings (matches the 'package' name in the
#       .proto file).
#  cls: Name of the callset message in the .proto file. This becomes the callset
#       class in the python bindings.

# The callset class should be located by 'pkg'.'mod'.'cls':
# Example ID 0: systemrpc.lib..system.Callset
# Example ID 1: rtosutils.lib..rtosutils.Callset
0:
  name: systemrpc
  pkg: systemrpc.lib
  mod: system
  cls: Callset

1:
  name: rtosutils
  pkg: rtosutils.lib
  mod: rtosutils
  cls: Callset
