# Flash access for the littlefs partition in boards/<board>.overlay.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# File system. FsApi mounts the fsapi_lfs fstab node.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# FsApi depends on this. It provides fs_mkfs for FsApi_format.
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FSAPI=y
CONFIG_FSAPIRPC=y

# FsApi_unpack_file reads /flash/etc/config/net.pb (see src/net_ip.c).
CONFIG_FSAPI_PB=y

# littlefs on the RAM disk (/ram, see src/fs.c).
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_FS_LITTLEFS_BLK_DEV=y

# Size of each open file cache. littlefs sizes its file cache heap from this
# value. It must be >= the largest cache of any mount: 256 for /flash (the
# fstab node cache-size) and 512 for /ram (littlefs uses one 512 B sector on a
# disk). A smaller value fails an open with -ENOMEM. FsApi checks the fstab
# nodes at build time; it cannot check the /ram mount.
CONFIG_FS_LITTLEFS_CACHE_SIZE=512

# Logging
CONFIG_FSAPI_LOG_LEVEL_INF=y
CONFIG_FSAPIRPC_LOG_LEVEL_INF=y
