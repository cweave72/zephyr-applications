# Flash access for the littlefs partition in boards/<board>.overlay.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# File system. FsApi mounts the fsapi_lfs fstab node.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# FsApi depends on this. It provides fs_mkfs for FsApi_format.
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FSAPI=y
CONFIG_FSAPIRPC=y

# Must be >= cache-size in the fsapi_lfs fstab node. littlefs sizes its file
# cache heap from this value, so a smaller value fails the second open with
# -ENOMEM. FsApi checks this at build time.
CONFIG_FS_LITTLEFS_CACHE_SIZE=256

# Logging
CONFIG_FSAPI_LOG_LEVEL_INF=y
CONFIG_FSAPIRPC_LOG_LEVEL_INF=y
