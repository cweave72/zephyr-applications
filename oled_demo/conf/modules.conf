CONFIG_SYSTEM=y
CONFIG_COBS=y
CONFIG_SWFIFO=y
CONFIG_TCPSOCKET=y
CONFIG_TCPSERVER=y
CONFIG_TCPRPCSERVER=y
CONFIG_RTOSUTILS=y

#Logging
CONFIG_TCPSOCKET_LOG_LEVEL_INF=y
CONFIG_TCPRPCSERVER_LOG_LEVEL_INF=y

CONFIG_JSON_LIBRARY=y
#CONFIG_LWM2M=y

CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y

CONFIG_SENSOR=y

CONFIG_SSD1306=y
CONFIG_SSD1306_DEFAULT_CONTRAST=128

CONFIG_LED_STRIP=y
CONFIG_MQTT_LIB=y

# For RANDOM
CONFIG_ENTROPY_GENERATOR=y

CONFIG_WS2812LED=y
CONFIG_RANDOM=y

CONFIG_PUBLISHER=y
CONFIG_MQTTCLIENT=y
CONFIG_MQTTCLIENT_SERVER_ADDR="192.168.1.7"
CONFIG_MQTTCLIENT_STACK_SIZE=2048
CONFIG_MQTTCLIENT_THREAD_PRIO=15
CONFIG_MQTTCLIENT_LOG_LEVEL_DBG=y
