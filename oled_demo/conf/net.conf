# Network related configs.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV6=n

CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_POSIX_NETWORKING=y

# Limit ram usage
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=6
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_MAX_CONN=10
CONFIG_NET_STATISTICS=n

# Shell
CONFIG_NET_SHELL=n

# Debugging
CONFIG_NET_LOG=y
